name: RC Circuit
level: 1
level_name: Basic Circuits
order: 5
difficulty: intermediate
estimated_time: 75-90 minutes
prerequisites:
  - 01-led-circuit
  - 02-voltage-divider
  - 04-transistor-switch
components:
  - Electrolytic capacitor, 100-470uF
  - Resistor, 10k-100k ohm
  - NPN transistor (BC547 / BC548 / 2N2222)
  - LED
  - Resistor, 220-330 ohm (LED)
  - Resistor, 1k ohm (transistor base)
  - Pushbutton
  - Breadboard
  - Jumper wires
  - 9V battery
tools:
  - Digital multimeter
  - Stopwatch or phone timer
skills:
  - Capacitor charge storage
  - RC time constant (tau = R x C)
  - Exponential charge/discharge behavior
  - Combining a capacitor with a transistor for timing
resources:
  - https://learn.sparkfun.com/tutorials/capacitors
  - https://www.electronics-tutorials.ws/rc/rc_1.html
  - https://www.electronics-tutorials.ws/rc/rc_2.html
  - https://www.youtube.com/@PrepFusion_GATE
  - https://www.falstad.com/circuit/
next: 06-light-sensor
next_level_preview:
  - name: Analog Electronics (Level 2)
    resources:
      - ../06-light-sensor/README.md
